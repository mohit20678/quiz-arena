<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d1a">
  <title>Quiz Arena — Review answers</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">◈</span><span>Quiz<span class="brand-accent">Arena</span></span><span class="pill" style="margin-left:8px">Review</span></div>
    <div class="topbar-right">
      <a class="btn btn-ghost btn-sm" href="/admin">Admin panel</a>
      <span class="pill" id="netLabel">Ready</span>
    </div>
  </header>

  <main class="app-shell admin-shell">
    <section class="screen active" id="loginScreen">
      <div class="card login-card">
        <div class="login-mark">🔒</div>
        <div class="eyebrow" style="justify-content:center">Second laptop / read only</div>
        <h1 style="font-size:clamp(26px,5vw,36px)">Review sign in</h1>
        <p class="center">Use the admin email and password to view every answer.</p>
        <form id="loginForm" novalidate>
          <div class="field"><label for="adminEmail">Email</label><input class="input" id="adminEmail" type="email" autocomplete="username"></div>
          <div class="field"><label for="adminPassword">Password</label><input class="input" id="adminPassword" type="password" autocomplete="current-password"></div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="loginButton">Sign in →</button>
        </form>
      </div>
    </section>

    <section class="screen" id="panelScreen">
      <div class="admin-head">
        <div>
          <div class="eyebrow">All answers</div>
          <h1 style="font-size:clamp(26px,5vw,36px)">Review answers</h1>
          <p class="tiny muted" id="summary">Loading…</p>
        </div>
        <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ Refresh</button>
      </div>

      <div class="card" style="margin-bottom:18px">
        <div class="lb-head">
          <h3>Answers by question</h3>
          <select class="input" id="questionFilter" style="max-width:340px"></select>
        </div>
        <div id="answersTable"></div>
        <div class="admin-actions" style="justify-content:flex-start;margin-top:16px">
          <button class="btn btn-sm" id="exportCsv">⬇ Download answers (Excel CSV)</button>
        </div>
      </div>

      <div class="card">
        <div class="lb-head"><h3>Student feedback</h3><span class="pill" id="feedbackCount">0 responses</span></div>
        <div id="feedbackList"></div>
        <div class="admin-actions" style="justify-content:flex-start;margin-top:16px">
          <button class="btn btn-sm" id="exportFeedback">⬇ Download feedback (Excel CSV)</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/review.js"></script>
</body>
</html>
